{% extends 'base.html' %}

{% block content %}
  <div class="row">
    <div class="col-md-8 offset-md-2">
      <h2>{{ post.title }}</h2>
      <p class="text-muted small">{{ post.created_at }}</p>
      <div class="mb-4">{{ post.content|linebreaks }}</div>

      <a class="btn btn-secondary me-2" href="{% url 'posts:update' post.pk %}">Edit</a>
      <a class="btn btn-danger me-2" href="{% url 'posts:delete' post.pk %}">Delete</a>
      <a class="btn btn-outline-primary" href="{% url 'posts:list' %}">Back to list</a>
    </div>
  </div>
{% endblock %}
