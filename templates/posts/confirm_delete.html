{% extends 'base.html' %}

{% block content %}
  <div class="row">
    <div class="col-md-6 offset-md-3">
      <h3>Delete Post</h3>
      <p>Are you sure you want to delete "<strong>{{ post.title }}</strong>"?</p>
      <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Yes, delete</button>
        <a class="btn btn-secondary" href="{% url 'posts:detail' post.pk %}">Cancel</a>
      </form>
    </div>
  </div>
{% endblock %}
